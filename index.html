<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MACHI — one small town, one whole day</title>
  <meta name="description" content="Scroll to fly through Machi, a miniature Japanese town, from morning to lantern light." />
  <meta name="theme-color" content="#F7F0E1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='52' height='56' rx='14' fill='%237FA36B'/%3E%3Ccircle cx='32' cy='30' r='11' fill='%23F7F0E1'/%3E%3C/svg%3E" />
  <style>
    :root, .sw-root {
      --sw-bg: #F7F0E1;          /* the day scenes' background colour */
      --sw-ink: #2b2430;
      --sw-ink-soft: #6a6072;
      --sw-accent: #7FA36B;
    }
    /* Night sections (engine toggles .sw-night): flip the ink tokens light.
       Must live here, unlayered — the engine's CSS is in @layer sw, so its
       own token rules can never override these page tokens. */
    .sw-root.sw-night {
      --sw-ink: #F8F2E4;
      --sw-ink-soft: #C6BED8;
    }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    /* No scroll progress bar at the top (user request, 2026-11-21) */
    .sw-scrollbar{display:none;}
    /* Night fix: top CTA button — ink token flips cream at night, keep the label dark */
    .sw-root.sw-night .sw-topcta{background:#F8F2E4;color:#2b2430;}
    /* Brand mark: five-story pagoda silhouette (overrides the engine's blob) */
    .sw-brand__mark{
      border-radius:0;
      box-shadow:none;
      background:linear-gradient(180deg,var(--sw-accent),color-mix(in srgb,var(--sw-accent) 55%,#000));
      -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2028%27%3E%3Cpath%20d%3D%27M11.7%200h0.6v2.4h1.3v0.8H10.4V2.4h1.3z%20M6.4%205.4L8.6%203.2h6.8l2.2%202.2-1.4%200.8H7.8z%20M10.4%206.2h3.2v3h-3.2z%20M4.4%2011.4L7%209.2h10l2.6%202.2-1.5%200.9H5.9z%20M10.2%2012.3h3.6v3.1h-3.6z%20M2.4%2017.6L5.4%2015.4h13.2l3%202.2-1.6%200.9H4z%20M9.2%2018.5h5.6V28H9.2z%27%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
      mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2028%27%3E%3Cpath%20d%3D%27M11.7%200h0.6v2.4h1.3v0.8H10.4V2.4h1.3z%20M6.4%205.4L8.6%203.2h6.8l2.2%202.2-1.4%200.8H7.8z%20M10.4%206.2h3.2v3h-3.2z%20M4.4%2011.4L7%209.2h10l2.6%202.2-1.5%200.9H5.9z%20M10.2%2012.3h3.6v3.1h-3.6z%20M2.4%2017.6L5.4%2015.4h13.2l3%202.2-1.6%200.9H4z%20M9.2%2018.5h5.6V28H9.2z%27%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
      filter:drop-shadow(0 4px 7px color-mix(in srgb,var(--sw-accent) 35%,transparent));
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <h1 class="visually-hidden">MACHI — one small town, one whole day</h1>
  <div id="world"></div>
  <div id="finale"></div>
  <noscript>
    <div style="max-width:640px;margin:8vh auto;padding:0 20px;text-align:center;font-family:system-ui,sans-serif;color:#2b2430;">
      <img src="assets/arrival.jpg" alt="Machi, a miniature Japanese town" style="width:100%;border-radius:16px;" />
      <p style="font-size:1.1rem;line-height:1.6;">MACHI is a scroll-driven flight through a miniature Japanese town, from morning to lantern light. It needs JavaScript enabled to fly — please turn it on and scroll.</p>
    </div>
  </noscript>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'MACHI まち', href: '#top' },
      cta: { label: 'Start your world', href: '#finale' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'arrival', label: 'Arrival',
          still: 'assets/arrival.jpg',
          clip: 'assets/vid/scene1.mp4',
          accent: '#7FA36B',
          eyebrow: 'A scroll-world demo',
          title: 'One small town, one whole day.',
          body: 'Scroll, and fly through Machi from first light to lantern light — no cuts, one continuous flight.',
          tags: ['Miniature diorama', 'Day to night', 'One take'],
        },
        {
          id: 'shotengai', label: 'Shotengai',
          still: 'assets/shotengai.jpg',
          clip: 'assets/vid/scene2.mp4',
          accent: '#E4572E',
          eyebrow: 'Late morning',
          title: 'The street that feeds the town.',
          body: 'Bakeries, noodle shops and bicycles — the everyday heart of Machi, modelled in miniature.',
          tags: ['Shotengai', 'Street level'],
        },
        {
          id: 'canal', label: 'The Canal',
          still: 'assets/canal.jpg',
          clip: 'assets/vid/scene3.mp4',
          accent: '#2E4057',
          eyebrow: 'Golden afternoon',
          title: 'Slow water, slower afternoons.',
          body: 'Carp streamers over the canal, willows trailing in the water, and nowhere to be in a hurry.',
          tags: ['Canal', 'Koinobori'],
        },
        {
          id: 'shrine', label: 'Shrine Steps',
          still: 'assets/shrine.jpg',
          clip: 'assets/vid/scene4.mp4',
          accent: '#F2A541',
          eyebrow: 'Dusk',
          title: 'The lanterns wake up first.',
          body: 'Up the shrine steps as the stone lanterns flicker on and the sky turns to peach.',
          tags: ['Shrine steps', 'First lights'],
        },
        {
          id: 'nightmarket', label: 'Night Market',
          still: 'assets/nightmarket.jpg',
          clip: 'assets/vid/scene5.mp4',
          accent: '#E4572E', dark: true,
          eyebrow: 'After dark',
          title: 'The alley that glows.',
          body: 'Steam, paper lanterns and midnight snacks — Machi stays up late.',
          tags: ['Night market', 'Lantern glow'],
        },
        {
          id: 'finale', label: 'The Lantern',
          still: 'assets/finale.jpg',
          clip: 'assets/vid/scene6.mp4',
          accent: '#F2A541', dark: true,
          eyebrow: 'Your world next',
          title: 'Every brand deserves a world.',
          body: 'Machi is a demo. Your town, shop or story could be the next one visitors fly through.',
          tags: [],
          cta: { primary: { label: 'Start your world', href: 'https://cerium-web-development.vercel.app/' },
                 secondary: { label: 'Back to morning', href: '#top' } },
        },
      ],
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
        'assets/vid/conn4.mp4',
        'assets/vid/conn5.mp4',
      ],
    });
  </script>
</body>
</html>
